# SDD autopilot relay — label → T3 webhook → loopy-desktop
#
# relay.t3.codes is behind Cloudflare. GitHub-hosted runners get CF 1010.
# This job runs on a self-hosted runner on loopy-desktop.
#
# Labels: sdd:ready (issue → implement) · sdd:pr (PR → review)
# Secrets: T3_WEBHOOK_URL, T3_WEBHOOK_SECRET
name: SDD Issue-to-Merge Autopilot

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number → sdd.implement"
        required: false
        type: string
      pr_number:
        description: "PR number → sdd.review"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  relay:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'sdd:ready')) ||
      (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(github.event.pull_request.labels.*.name, 'sdd:pr'))
    runs-on: [self-hosted, linux, loopy-desktop]
    steps:
      - name: Actor permission guard
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
          ALLOWED: loopy-lim
        run: |
          set -euo pipefail
          perm="$(gh api "repos/${REPO}/collaborators/${ACTOR}/permission" --jq '.permission')"
          case "$perm" in
            admin|maintain|write) echo "actor=${ACTOR} permission=${perm}" ;;
            *)
              if [[ ",${ALLOWED}," == *",${ACTOR},"* ]]; then
                echo "actor=${ACTOR} allowlisted"
              else
                echo "::error::Actor ${ACTOR} lacks write permission (${perm})"
                exit 1
              fi
              ;;
          esac

      - name: Fork PR guard
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          head='${{ github.event.pull_request.head.repo.full_name }}'
          base='${{ github.repository }}'
          if [[ "$head" != "$base" ]]; then
            echo "::error::Cross-repository (fork) PR blocked: ${head}"
            exit 1
          fi

      - name: Dispatch T3 webhook (loopy-desktop)
        env:
          T3_WEBHOOK_URL: ${{ secrets.T3_WEBHOOK_URL }}
          T3_WEBHOOK_SECRET: ${{ secrets.T3_WEBHOOK_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: |
          set -euo pipefail
          : "${T3_WEBHOOK_URL:?T3_WEBHOOK_URL secret missing}"
          : "${T3_WEBHOOK_SECRET:?T3_WEBHOOK_SECRET secret missing}"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            STAGE=review
            ISSUE_NUMBER=""
            PR_NUMBER="${PR_NUMBER:-}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && -n "${PR_NUMBER:-}" && -z "${ISSUE_NUMBER:-}" ]]; then
            STAGE=review
            ISSUE_NUMBER=""
          else
            STAGE=implement
            PR_NUMBER=""
            ISSUE_NUMBER="${ISSUE_NUMBER:-}"
          fi

          export STAGE ISSUE_NUMBER PR_NUMBER
          export PROMPT="SDD ${STAGE} for ${REPO}. Actor=${ACTOR}. Follow loopy-lim/skills automation/t3-webhook-prompt.md on loopy-desktop."

          BODY_PATH=$(mktemp)
          SIG_PATH=$(mktemp)
          export BODY_PATH SIG_PATH
          python3 - <<'PY'
          import hashlib, hmac, json, os
          stage = os.environ["STAGE"]
          def parse_int(v):
              v = (v or "").strip()
              return int(v) if v.isdigit() else None
          payload = {
              "event": f"sdd.{stage}",
              "stage": stage,
              "repository": os.environ["REPO"],
              "issueNumber": parse_int(os.environ.get("ISSUE_NUMBER")),
              "prNumber": parse_int(os.environ.get("PR_NUMBER")),
              "actor": os.environ["ACTOR"],
              "autoMergeAllowed": True,
              "prompt": os.environ["PROMPT"],
          }
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          digest = hmac.new(os.environ["T3_WEBHOOK_SECRET"].encode(), body, hashlib.sha256).hexdigest()
          open(os.environ["BODY_PATH"], "wb").write(body)
          open(os.environ["SIG_PATH"], "w", encoding="utf-8").write(f"sha256={digest}")
          print(json.dumps(payload, ensure_ascii=False))
          PY

          SIG=$(cat "$SIG_PATH")
          curl -fsSL -X POST "$T3_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: unikit-ui-sdd-relay/1.0 (self-hosted; loopy-desktop)" \
            -H "X-SDD-Event: sdd.${STAGE}" \
            -H "X-Hub-Signature-256: ${SIG}" \
            -H "X-T3-Signature: ${SIG}" \
            --data-binary @"$BODY_PATH"
          echo
          echo "<!-- sdd-status: WEBHOOK_DISPATCHED stage=${STAGE} -->"
          rm -f "$BODY_PATH" "$SIG_PATH"
