# SDD autopilot relay — manual dispatch only (loopy-desktop)
#
# Label/synchronize triggers are handled by the repository webhook
# (GitHub -> relay.t3.codes -> T3 scheduled task). This workflow used to
# relay the same events through Actions too, which double-delivered every
# event and re-injected stale ones whenever the self-hosted runner came
# back online (2026-11-18 cleanup). Keep this as a manual relay only.
#
# Secrets: T3_WEBHOOK_URL, T3_WEBHOOK_SECRET
name: SDD Issue-to-Merge Autopilot

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number → sdd.implement"
        required: false
        type: string
      pr_number:
        description: "PR number → sdd.review"
        required: false
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  relay:
    runs-on: [self-hosted, linux, loopy-desktop]
    steps:
      - name: Dispatch T3 webhook (loopy-desktop)
        env:
          T3_WEBHOOK_URL: ${{ secrets.T3_WEBHOOK_URL }}
          T3_WEBHOOK_SECRET: ${{ secrets.T3_WEBHOOK_SECRET }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          : "${T3_WEBHOOK_URL:?T3_WEBHOOK_URL secret missing}"
          : "${T3_WEBHOOK_SECRET:?T3_WEBHOOK_SECRET missing}"

          if [[ -n "${PR_NUMBER:-}" && -z "${ISSUE_NUMBER:-}" ]]; then
            STAGE=review
            ISSUE_NUMBER=""
          else
            STAGE=implement
            PR_NUMBER=""
            ISSUE_NUMBER="${ISSUE_NUMBER:-}"
          fi

          export STAGE ISSUE_NUMBER PR_NUMBER
          export PROMPT="SDD ${STAGE} for ${REPO}. Actor=${ACTOR}. Follow loopy-lim/skills automation/t3-webhook-prompt.md on loopy-desktop."

          BODY_PATH=$(mktemp)
          SIG_PATH=$(mktemp)
          export BODY_PATH SIG_PATH
          python3 - <<'PY'
          import hashlib, hmac, json, os
          stage = os.environ["STAGE"]
          def parse_int(v):
              v = (v or "").strip()
              return int(v) if v.isdigit() else None
          issue_no = parse_int(os.environ.get("ISSUE_NUMBER"))
          pr_no = parse_int(os.environ.get("PR_NUMBER"))
          label_name = "sdd:pr" if stage == "review" else "sdd:ready"
          payload = {
              "event": f"sdd.{stage}",
              "stage": stage,
              "issueNumber": issue_no,
              "prNumber": pr_no,
              "actor": os.environ["ACTOR"],
              "autoMergeAllowed": True,
              "prompt": os.environ["PROMPT"],
              # Mirror the direct GitHub webhook shape so the T3 task's
              # filters (body.action in [labeled, synchronize]) and dedupe
              # keys (repository.full_name / issue.number / pull_request.number)
              # accept manual dispatches too.
              "action": "labeled",
              "label": {"name": label_name},
              "repository": {"full_name": os.environ["REPO"]},
              "sender": {"login": os.environ["ACTOR"]},
          }
          if issue_no is not None:
              payload["issue"] = {"number": issue_no}
          if pr_no is not None:
              payload["pull_request"] = {"number": pr_no}
          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          digest = hmac.new(os.environ["T3_WEBHOOK_SECRET"].encode(), body, hashlib.sha256).hexdigest()
          open(os.environ["BODY_PATH"], "wb").write(body)
          open(os.environ["SIG_PATH"], "w", encoding="utf-8").write(f"sha256={digest}")
          print(json.dumps(payload, ensure_ascii=False))
          PY

          SIG=$(cat "$SIG_PATH")
          # Stable per run/attempt: replay dedupe keys off this header.
          DELIVERY="run-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          curl -fsSL -X POST "$T3_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "User-Agent: unikit-ui-sdd-relay/1.0 (self-hosted; loopy-desktop)" \
            -H "X-SDD-Event: sdd.${STAGE}" \
            -H "X-GitHub-Delivery: ${DELIVERY}" \
            -H "X-Hub-Signature-256: ${SIG}" \
            -H "X-T3-Signature: ${SIG}" \
            --data-binary @"$BODY_PATH"
          echo
          echo "<!-- sdd-status: WEBHOOK_DISPATCHED stage=${STAGE} -->"
          rm -f "$BODY_PATH" "$SIG_PATH"
