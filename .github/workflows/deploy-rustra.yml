# rustra 소개 사이트 → Cloudflare Pages (정적 apps/rustra/out/)
# UniKit deploy-pages.yml 패턴을 rustra-site 프로젝트에 적용
name: Deploy Rustra

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "apps/rustra/**"
      - "packages/unikit/**"
      - ".github/workflows/deploy-rustra.yml"
      - "bun.lock"
      - "package.json"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/rustra
        run: bun run typecheck

      - name: Build static site
        working-directory: apps/rustra
        run: bun run build

      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/rustra
          command: pages deploy out --project-name=rustra-site --branch=main

      - name: Attach custom domains
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          for domain in rustra.ll3.kr; do
            echo "Attaching custom domain ${domain} to Pages..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/rustra-site/domains" \
              -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --data "{\"name\":\"${domain}\"}" | jq . || true
          done

          echo "Querying Pages domains status..."
          curl -s -X GET "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/rustra-site/domains" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" | jq . || true
