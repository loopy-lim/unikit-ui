# E2E 스모크 — Android 에뮬레이터 + Maestro (apps/expo 쇼케이스)
# AGENTS.md의 수동 절차(prebuild → assembleDebug x86_64 → 설치 → adb reverse →
# Metro)를 그대로 자동화하고, 앱이 이미 달고 있는 accessibilityLabel로 실기기
# 경로(실행 크래시 가드 · 테마 왕복 · 검색 필터 · 모달 열림/닫힘)를 검증한다.
# 접근성 트리로 동작하므로 앱에 계측 코드가 필요 없다(Maestro 공식 RN 지원).
# 잡는 것: 번들은 되는데 실행 시 터지는 전부. 못 잡는 것: 픽셀 정확도(스크린샷은
# artifact로 모으되 diff는 후속), 제스처 감촉, 안전영역(에뮬레이터 노치 없음).
name: E2E Android (Maestro)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/unikit/src/**"
      - "apps/expo/**"
      - ".maestro/**"
      - ".github/workflows/e2e-android.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "packages/unikit/src/**"
      - "apps/expo/**"
      - ".maestro/**"
      - ".github/workflows/e2e-android.yml"
      - "package.json"
      - "bun.lock"

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

# 타사 원격 설치 스크립트(Maestro)를 실행하는 만큼 토큰은 최소 읽기 권한만
# (publish.yml·sdd-autopilot.yml 관행과 동일 — 이 잡엔 쓰기 스코프가 필요 없다)
permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 의존성·빌드 캐시
      - uses: gradle/actions/setup-gradle@v4

      # assembleDebug가 SDK 구성요소를 내려받을 수 있게 라이선스 승인
      - name: Android SDK 라이선스 승인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # 에뮬레이터 시스템 이미지(~1.5GB) 재다운로드 방지
      - name: 에뮬레이터 시스템 이미지 캐시 (API 35 x86_64)
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35
          key: emulator-sysimg-android-35-x86_64-v1

      # get.maestro.mobile.dev는 실행 시점의 최신을 당겨오는 대신 MAESTRO_VERSION을
      # 지정하면 해당 GitHub 릴리스(cli-<버전>/maestro.zip)로 내려받는다 — 이 플로우를
      # 로컬 AVD에서 검증한 바로 그 버전으로 고정(공급망 트러스트 앵커)
      - name: Maestro 설치 (버전 고정)
        env:
          MAESTRO_VERSION: "2.12.1"
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # android/는 커밋돼 있지 않다(apps/expo/.gitignore) — prebuild로 생성
      - name: 네이티브 프로젝트 생성 (expo prebuild)
        working-directory: apps/expo
        run: bun x expo prebuild --platform android --no-install

      - name: 디버그 APK 빌드 (x86_64 — AGENTS.md 수동 절차와 같은 플래그)
        working-directory: apps/expo/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      # x86_64 에뮬레이터는 하드웨어 가속(KVM) 없이는 부팅을 거부한다. android-emulator-runner는
      # access(/dev/kvm, R_OK|W_OK) 성공 여부로 가속을 판정하는데, 이 러너 이미지의
      # /dev/kvm은 runner 사용자가 접근하지 못해 "-accel off"로 내려가 즉시 사망한다
      # (2026-11-26 실행 45844581153·45850246165 — 부팅 타임아웃 10분 만료로 오인하기 쉽다).
      # udev 규칙으로 /dev/kvm을 0666로 열고 rw 가능 여부까지 검증해 즉시·명시적으로 실패시킨다.
      - name: KVM 접근 권한 부여 및 확인
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::runner 사용자가 /dev/kvm에 rw 접근하지 못한다 — 에뮬레이터가 부팅을 거부한다."
            exit 1
          fi

      - name: 에뮬레이터 부팅 + Maestro 스모크
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            adb install -r apps/expo/android/app/build/outputs/apk/debug/app-debug.apk
            adb reverse tcp:8081 tcp:8081
            (cd apps/expo && bun x expo start --port 8081 > ../../.maestro/metro.log 2>&1 &)
            # Metro가 8081을 듣기 전에 앱이 번들을 당기면 red screen이 뜬다 —
            # /status가 응답한 뒤에 플로우(launchApp)를 시작한다(최대 120초 대기).
            # 대기 실패를 그냥 넘기면 maestro의 launch 타임아웃으로 엉뚱하게 귀결되므로
            # 여기서 즉시 실패시키고 로그로 안내한다.
            metro_ready=0
            for i in $(seq 1 60); do
              if curl -sf -o /dev/null http://localhost:8081/status; then metro_ready=1; break; fi
              sleep 2
            done
            if [ "$metro_ready" != "1" ]; then
              echo "Metro가 120초 내에 8081을 듣지 시작하지 않았다 — .maestro/metro.log 참고"
              exit 1
            fi
            maestro test .maestro/ --debug-output .maestro/evidence

      # upload-artifact v4는 검색 경로들의 최소 공통 조상에 루트를 두므로
      # 절대경로(/tmp)와 섞지 않는다 — 증거는 전부 워크스페이스 상대 .maestro/ 아래
      - name: 증거 업로드 (스크린샷·계층·기기 로그·Metro 로그)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-evidence
          path: .maestro
          if-no-files-found: ignore
