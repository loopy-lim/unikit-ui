# E2E 스모크 — Android 에뮬레이터 + Maestro (apps/expo 쇼케이스)
# AGENTS.md의 수동 절차(prebuild → assembleDebug x86_64 → 설치 → adb reverse →
# Metro)를 그대로 자동화하고, 앱이 이미 달고 있는 accessibilityLabel로 실기기
# 경로(실행 크래시 가드 · 테마 왕복 · 검색 필터 · 모달 열림/닫힘)를 검증한다.
# 접근성 트리로 동작하므로 앱에 계측 코드가 필요 없다(Maestro 공식 RN 지원).
# 잡는 것: 번들은 되는데 실행 시 터지는 전부. 못 잡는 것: 픽셀 정확도(스크린샷은
# artifact로 모으되 diff는 후속), 제스처 감촉, 안전영역(에뮬레이터 노치 없음).
name: E2E Android (Maestro)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/unikit/src/**"
      - "apps/expo/**"
      - ".maestro/**"
      - ".github/workflows/e2e-android.yml"
      - "package.json"
      - "bun.lock"
  push:
    branches: [main]
    paths:
      - "packages/unikit/src/**"
      - "apps/expo/**"
      - ".maestro/**"
      - ".github/workflows/e2e-android.yml"
      - "package.json"
      - "bun.lock"

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

# 타사 원격 설치 스크립트(Maestro)를 실행하는 만큼 토큰은 최소 읽기 권한만
# (publish.yml·sdd-autopilot.yml 관행과 동일 — 이 잡엔 쓰기 스코프가 필요 없다)
permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle 의존성·빌드 캐시
      - uses: gradle/actions/setup-gradle@v4

      # assembleDebug가 SDK 구성요소를 내려받을 수 있게 라이선스 승인.
      # pipefail이 꺼진 Actions bash에선 yes의 SIGPIPE가 실패를 만들지 않으므로
      # || true는 sdkmanager 본연의 실패만 삼킨다 — 걸지 않는다(실패는 여기서 즉시).
      - name: Android SDK 라이선스 승인
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null

      # 에뮬레이터 시스템 이미지(~1.5GB) 재다운로드 방지. /usr/local/lib/android/sdk는
      # ubuntu-latest 러너 이미지의 공식 ANDROID 루트(Actions env 컨텍스트엔 러너
      # 기본 환경변수가 안 들어와 셸 확장 대신 리터럴로 쓴다). 키에는 대상
      # 이미지(arch·target·OS)를 전부 반영해 target 교체 시 충돌하지 않게 한다.
      - name: 에뮬레이터 시스템 이미지 캐시 (API 35 google_apis x86_64)
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/system-images/android-35/google_apis/x86_64
          key: emulator-sysimg-${{ runner.os }}-android-35-google_apis-x86_64-v1
          restore-keys: emulator-sysimg-${{ runner.os }}-android-35-

      # 설치 스크립트(get.maestro.mobile.dev)를 파이프로 실행하는 대신, 고정한
      # GitHub 릴리스 아티팩트(cli-2.12.1/maestro.zip)를 직접 내려받고 SHA-256로
      # 검증한다 — 공급망 트러스트 앵커를 불변 릴리스+체크섬으로. 2.12.1은 이
      # 플로우를 로컬 AVD에서 검증한 버전이다. --version 실행으로 설치 즉시 파손 확인.
      - name: Maestro 설치 (릴리스 고정 + 체크섬 검증)
        env:
          MAESTRO_VERSION: "2.12.1"
          MAESTRO_SHA256: "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  /tmp/maestro.zip" | sha256sum -c -
          mkdir -p "$HOME/.maestro"
          unzip -q -o /tmp/maestro.zip -d "$HOME/.maestro"
          # zip 루트가 maestro/ 폴더라 한 겹 들린다 — 설치 스크립트와 같은 배치로 편다
          mv "$HOME/.maestro/maestro"/* "$HOME/.maestro/"
          rmdir "$HOME/.maestro/maestro"
          "$HOME/.maestro/bin/maestro" --version
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # android/는 커밋돼 있지 않다(apps/expo/.gitignore) — prebuild로 생성
      - name: 네이티브 프로젝트 생성 (expo prebuild)
        working-directory: apps/expo
        run: bun x expo prebuild --platform android --no-install

      - name: 디버그 APK 빌드 (x86_64 — AGENTS.md 수동 절차와 같은 플래그)
        working-directory: apps/expo/android
        run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      # x86_64 에뮬레이터는 하드웨어 가속(KVM) 없이는 부팅을 거부한다. android-emulator-runner는
      # access(/dev/kvm, R_OK|W_OK) 성공 여부로 가속을 판정하는데, 이 러너 이미지의
      # /dev/kvm은 runner 사용자가 접근하지 못해 "-accel off"로 내려가 즉시 사망한다
      # (2026-11-26 실행 45844581153·45850246165 — 부팅 타임아웃 10분 만료로 오인하기 쉽다).
      # udev 규칙으로 /dev/kvm을 0666로 열고 rw 가능 여부까지 검증해 즉시·명시적으로 실패시킨다.
      - name: KVM 접근 권한 부여 및 확인
        run: |
          echo 'KERNEL=="kvm",GROUP="kvm",MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -la /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::runner 사용자가 /dev/kvm에 rw 접근하지 못한다 — 에뮬레이터가 부팅을 거부한다."
            exit 1
          fi

      # 액션이 script를 줄 단위로 쪼개 sh -c로 실행하므로(실행 45853306577에서
      # for 루프가 잘려 사망 — script-parser.ts 참고), 제어 흐름 전체를
      # .maestro/run-smoke.sh에 두고 한 줄 호출로 실행한다.
      - name: 에뮬레이터 부팅 + Maestro 스모크
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: sh .maestro/run-smoke.sh

      # upload-artifact v4는 점 디렉터리(.maestro)를 직접 지정해도 못 찾는다(실행
      # 45855459563 — "No files were found") — 증거는 점이 아닌 e2e-evidence/에
      # 기록되고 여기서는 그 경로만 올린다.
      - name: 증거 업로드 (스크린샷·계층·기기 로그·Metro 로그)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-evidence
          path: e2e-evidence
