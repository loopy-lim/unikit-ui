# CI — 푸시·PR마다 전체 검증 관문 실행
# (로컬 게이트와 동일: 단위 테스트 · typecheck · audit:design · ui-sdk 프로브 · 웹 빌드 ·
#  데스크톱 프론트 빌드 · 엑스포 Android/iOS 번들 컴파일 — 정적 검증은 전부 이 관문에,
#  실기기 실행 경로는 e2e-android.yml이 담당한다)
name: CI

on:
  push:
    branches: [main]
  pull_request:

# 이 관문은 읽기만 필요하다 — 토큰은 최소 권한으로(publish.yml·sdd-autopilot.yml 관행)
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: 단위 테스트
        run: bun run test

      - name: 타입 검사 (패키지·웹·엑스포·모바일·데스크톱)
        run: bun run typecheck

      - name: 디자인 일관성 감사 (audit:design)
        run: bun run audit:design

      # 에디터 WebView 번들 — 네이티브 에디터가 삼키는 단일 HTML 번들(vite
      # singlefile) 컴파일 + src/editor/editor-html.ts 인라인 동기화까지 관문에
      # 넣는다(AGENTS.md 수동 절차의 무인 버전).
      - name: 에디터 WebView 번들 빌드 (vite singlefile + 인라인 동기화)
        working-directory: packages/unikit
        run: bun run build:editor

      # 생성물 드리프트 — globals.css 토큰 블록·registry.json theme·tokens.md·
      # editor-html.ts은 전부 생성물(AGENTS.md 직접 편집 금지). 체크아웃 상태에서
      # 재생성해 커밋과 한 글자라도 다르면 실패한다(로컬 멱등 검증 완료 — 두 번
      # 실행의 diff가 동일하다).
      - name: 생성물 드리프트 검사 (generate:design → git diff --exit-code)
        working-directory: packages/unikit
        run: |
          bun run generate:design
          git diff --exit-code -- ../../apps/web/app/globals.css docs/tokens.md registry.json src/editor/editor-html.ts

      - name: UI SDK 계약 프로브 (probe:ui-sdk)
        working-directory: packages/unikit
        run: bun run probe:ui-sdk

      - name: 웹 빌드 (Next.js)
        working-directory: apps/web
        run: bun run build

      # 데스크톱(Tauri) 프론트엔드 — default export 조건의 실제 생산 빌드 경로.
      # tauri build(Rust)가 아니라 웹 에셋 번들까지만(tsc + vite)
      - name: 데스크톱 프론트 빌드 (Tauri 웹 에셋)
        working-directory: apps/desktop
        run: bun run build

      - name: 네이티브 번들 컴파일 (Expo export — Android/Hermes)
        working-directory: apps/expo
        run: bun x expo export --platform android

      - name: 네이티브 번들 컴파일 (Expo export — iOS/Hermes)
        working-directory: apps/expo
        run: bun x expo export --platform ios

  # 시각 회귀 — 컴포넌트 페이지 63종 스크린샷을 커밋된 베이스라인과 비교한다.
  # 렌더링 환경을 로컬과 동일하게 유지하려고 공식 Playwright 이미지 컨테이너에서
  # 돌린다(브라우저 내장·폰트는 정적 export에 자체 호스팅). 베이스라인 갱신은
  # apps/web의 bun run test:visual:update(같은 이미지로 재생성)만 인정한다.
  visual:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: 의존성 설치
        run: bun install --frozen-lockfile

      - name: 웹 빌드 (정적 export)
        working-directory: apps/web
        run: bun run build

      - name: 시각 회귀 (Playwright 스크린샷 비교)
        working-directory: apps/web
        run: bun x playwright test

      - name: 실패 시 diff 아티팩트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/web/test-results
          retention-days: 7
