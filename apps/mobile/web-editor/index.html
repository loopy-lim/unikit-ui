<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>editor</title>
    <style>
      /* UniKit UI 토큰(라이트/다크) — packages/unikit/src/theme/tokens.ts 값과 동일. */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --primary: 240 5.9% 10%;
        --radius: 0.5rem;
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --border: 240 3.7% 15.9%;
        --primary: 0 0% 98%;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(var(--background));
        -webkit-tap-highlight-color: transparent;
      }
      #editor {
        height: 100%;
        padding: 12px 16px 96px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      /* 본문 타이포그래피(제목·목록·인용·코드…)는 패키지 editor-prose.css가
         담당한다(src/main.ts에서 import — 빌드 시 이 HTML로 인라인된다).
         min-height는 WebView 화면 전체를 편집 영역으로 쓰기 위한 앱 소유 규칙. */
      .tiptap {
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
