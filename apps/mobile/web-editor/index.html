<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>editor</title>
    <style>
      /* UniKit UI 토큰(라이트/다크) — packages/unikit/src/theme/tokens.ts 값과 동일. */
      :root {
        --background: 0 0% 100%;
        --foreground: 240 10% 3.9%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --border: 240 5.9% 90%;
        --primary: 240 5.9% 10%;
        --radius: 0.5rem;
      }
      .dark {
        --background: 240 10% 3.9%;
        --foreground: 0 0% 98%;
        --muted: 240 3.7% 15.9%;
        --muted-foreground: 240 5% 64.9%;
        --border: 240 3.7% 15.9%;
        --primary: 0 0% 98%;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: hsl(var(--background));
        -webkit-tap-highlight-color: transparent;
      }
      #editor {
        height: 100%;
        padding: 12px 16px 96px;
        box-sizing: border-box;
        overflow-y: auto;
      }
      .tiptap {
        color: hsl(var(--foreground));
        caret-color: hsl(var(--primary));
        outline: none;
        min-height: 100%;
      }
      .tiptap p {
        line-height: 1.7;
        margin: 0.6em 0;
      }
      .tiptap h1,
      .tiptap h2,
      .tiptap h3 {
        font-weight: 600;
        line-height: 1.3;
        margin: 1.2em 0 0.4em;
        letter-spacing: -0.01em;
      }
      .tiptap h1 {
        font-size: 1.6rem;
        margin-top: 0.3em;
      }
      .tiptap h2 {
        font-size: 1.35rem;
      }
      .tiptap h3 {
        font-size: 1.15rem;
      }
      .tiptap ul,
      .tiptap ol {
        padding-inline-start: 1.4em;
        margin: 0.6em 0;
      }
      .tiptap ul {
        list-style: disc;
      }
      .tiptap ul ul {
        list-style: circle;
      }
      .tiptap ol {
        list-style: decimal;
      }
      .tiptap li {
        margin: 0.2em 0;
      }
      .tiptap li > p {
        margin: 0;
      }
      .tiptap blockquote {
        border-inline-start: 2px solid hsl(var(--border));
        color: hsl(var(--muted-foreground));
        padding-inline-start: 1em;
        margin: 0.8em 0;
      }
      .tiptap code {
        background: hsl(var(--muted));
        border-radius: calc(var(--radius) - 4px);
        font-size: 0.875em;
        padding: 0.1em 0.35em;
      }
      .tiptap pre {
        background: hsl(var(--muted));
        border: 1px solid hsl(var(--border));
        border-radius: calc(var(--radius) - 2px);
        margin: 0.8em 0;
        padding: 0.6em 0.8em;
        overflow-x: auto;
      }
      .tiptap pre code {
        background: transparent;
        padding: 0;
      }
      .tiptap a {
        color: hsl(var(--primary));
        text-decoration: underline;
      }
      .tiptap hr {
        border: none;
        border-top: 1px solid hsl(var(--border));
        margin: 1.6em 0;
      }
      /* 첫 노드가 문단·제목 어느 쪽이어도 플레이스홀더가 뜨게 한다. */
      .tiptap p.is-editor-empty:first-child::before,
      .tiptap h1.is-editor-empty:first-child::before,
      .tiptap h2.is-editor-empty:first-child::before,
      .tiptap h3.is-editor-empty:first-child::before {
        color: hsl(var(--muted-foreground));
        content: attr(data-placeholder);
        float: left;
        height: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
